{% extends 'myapp/base.html' %}
{% load static %}

{% block content %}
<style>
    .form-container {
        max-width: 600px;
        margin: 60px auto;
        padding: 40px;
        background-color: #fce4ec;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .form-container h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #c2185b;
    }

    .form-container form input,
    .form-container form textarea,
    .form-container form select {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
    }

    .form-container button {
        background-color: #ff4081;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 10px;
        cursor: pointer;
        display: block;
        margin: 0 auto;
    }

    .form-container button:hover {
        background-color: #f50057;
    }
</style>

<div class="form-container">
    <h2>Добавить курс</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить курс</button>
    </form>
</div>
{% endblock %}
