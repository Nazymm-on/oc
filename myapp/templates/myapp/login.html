{% extends 'myapp/base.html' %}
{% load static %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-tabs">
        <div class="auth-tab active">login</div>
        <div class="auth-tab">registration</div>
    </div>

    <form method="POST" class="auth-form">
        {% csrf_token %}
        {{ form.username }}
        {{ form.password }}
        <button type="submit">log in</button>
    </form>
</div>
{% endblock %}
