{% extends 'myapp/base.html' %}
{% load static %}

{% block content %}
<style>
    .auth-wrapper {
        max-width: 450px;
        margin: 60px auto;
        padding: 40px;
        background-color: #e6a9b3;
        border-radius: 25px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        text-align: center;
        color: #fff;
    }

    .auth-wrapper h2 {
        font-size: 28px;
        margin-bottom: 30px;
        font-weight: bold;
        color: white;
    }

    .auth-form input,
    .auth-form select {
        width: 100%;
        padding: 14px;
        margin-bottom: 10px;
        border: none;
        border-radius: 20px;
        background-color: #f0f4ff;
        color: #333;
        font-size: 16px;
    }

    .auth-form button {
        padding: 12px 30px;
        font-size: 16px;
        background-color: #ff4da6;
        color: white;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition: background 0.3s ease;
    }

    .auth-form button:hover {
        background-color: #e04390;
    }

    .auth-wrapper p {
        margin-top: 20px;
        color: #fff;
    }

    .auth-wrapper a {
        color: #fff;
        font-weight: bold;
        text-decoration: underline;
    }

    .auth-wrapper a:hover {
        color: #ffd5e8;
    }

    .errorlist {
        color: yellow;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 14px;
    }

    .username-check {
        font-size: 14px;
        margin-bottom: 10px;
    }
</style>

<div class="auth-wrapper">
    <h2>Регистрация</h2>
    <form method="POST" class="auth-form">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
            {% if field.name == 'username' %}
                <div id="username-check" class="username-check"></div>
            {% endif %}
        {% endfor %}
        <button type="submit">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const usernameInput = document.querySelector("input[name='username']");
    const feedback = document.getElementById("username-check");

    usernameInput.addEventListener("input", function () {
        const username = usernameInput.value;
        if (username.length < 3) {
            feedback.innerText = "Минимум 3 символа";
            feedback.style.color = "yellow";
            return;
        }

        fetch(`/check-username/?username=${encodeURIComponent(username)}`)
            .then(response => response.json())
            .then(data => {
                if (data.exists) {
                    feedback.innerText = "Это имя уже занято 😢";
                    feedback.style.color = "yellow";
                } else {
                    feedback.innerText = "Имя доступно ✅";
                    feedback.style.color = "#00ffcc";
                }
            });
    });
});
</script>
{% endblock %}
