{% extends 'myapp/base.html' %}
{% load static %}

{% block content %}
<style>
    .edit-form-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffe6f0;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    .edit-form-container h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #cc0066;
    }

    .edit-form-container label {
        font-weight: bold;
        margin-top: 15px;
        display: block;
        color: #333;
    }

    .edit-form-container input,
    .edit-form-container textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 10px;
        border: 1px solid #ccc;
    }

    .edit-form-container button {
        margin-top: 20px;
        width: 100%;
        background-color: #ff4da6;
        color: white;
        border: none;
        padding: 12px;
        font-size: 16px;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    .edit-form-container button:hover {
        background-color: #e04390;
    }

    .back-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #ff4da6;
        text-decoration: none;
        font-weight: bold;
    }

    .back-link:hover {
        text-decoration: underline;
    }
</style>

<div class="edit-form-container">
    <a href="{% url 'teacher_dashboard' %}" class="back-link">← Назад в панель преподавателя</a>

    <h2>Редактировать курс: {{ course.title }}</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">💾 Сохранить изменения</button>
    </form>
</div>
{% endblock %}
