{% extends 'myapp/base.html' %}
{% block content %}
<h2>{{ course.title }}</h2>
<p>{{ course.description }}</p>

<h3>Уроки</h3>
<ul>
  {% for lesson in lessons %}
    <li>
      <strong>{{ lesson.title }}</strong><br>
      <video width="400" controls>
        <source src="{{ lesson.video_url }}">
      </video><br>
      <p>{{ lesson.lab_description }}</p>
    </li>
  {% endfor %}
</ul>
{% endblock %}
