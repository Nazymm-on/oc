{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OnlineLearningHub</title>
    <link rel="stylesheet" href="{% static 'myapp/style.css' %}">
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 40% 40%, rgba(255, 209, 209, 0.6), rgba(215, 226, 255, 0.6), #fff);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            font-weight: 600;
        }

        .logo-text {
            font-size: 14px;
            letter-spacing: 1px;
        }

        .nav-links a {
            margin-left: 30px;
            text-decoration: none;
            color: #dd5e40;
            font-size: 16px;
            text-shadow: 1px 1px #f8d2c2;
        }

        .hero {
            text-align: center;
            padding: 100px 30px;
        }

        .hero h1 {
            font-size: 60px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .hero p {
            font-size: 20px;
            color: #222;
            margin-bottom: 40px;
        }

        .line {
            width: 250px;
            height: 2px;
            background-color: black;
            margin: 20px auto;
        }

        .footer-line {
            width: 90%;
            margin: 80px auto 20px;
            border-bottom: 1px solid #aaa;
        }

        /* Отзывы */
        #reviews {
            padding: 80px 40px;
            text-align: center;
        }

        #reviews h2 {
            font-size: 32px;
        }

        #reviews p {
            max-width: 600px;
            margin: 20px auto;
            color: #444;
        }

        /* Модалка */
        #auth-modal {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center; align-items: center;
            z-index: 1000;
        }

        #auth-modal .modal-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        #auth-modal a {
            margin: 0 10px;
            font-size: 16px;
            color: #008080;
            text-decoration: none;
        }

        #auth-modal button {
            margin-top: 20px;
            padding: 8px 16px;
            border: none;
            background: #008080;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        #auth-modal button:hover {
            background: #006666;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo-text">
            <img src="{% static 'myapp/logo.png' %}" alt="logo" style="height: 25px; vertical-align: middle; margin-right: 10px;">
            ONLINELEARNINGHUB
        </div>
        <div class="nav-links">
            <a href="#reviews">Reviews</a>
            <a href="javascript:void(0);" onclick="openModal()">Login/register</a>
        </div>
    </div>

    <div class="hero">
        <h1>Hello young coder</h1>
        <div class="line"></div>
        <p>Add your thesis title here</p>
    </div>

    <div class="footer-line"></div>

    <div id="reviews">
        <h2>Отзывы наших учеников</h2>
        <p>Здесь появятся отзывы студентов о наших курсах, их впечатления и успехи!</p>
    </div>

    <!-- Модалка -->
    <div id="auth-modal">
        <div class="modal-box">
            <h2>Войти или Зарегистрироваться</h2>
            <p style="margin: 20px 0;">
                <a href="{% url 'login' %}">🔐 Войти</a>
                <a href="{% url 'register' %}">📝 Регистрация</a>
            </p>
            <button onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('auth-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('auth-modal').style.display = 'none';
        }
    </script>
</body>
</html>
