{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Онлайн-курсы</title>
    <link rel="stylesheet" href="{% static 'myapp/style.css' %}">
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center;">
                <a href="{% url 'course_list' %}">
                    <img src="{% static 'myapp/logo.png' %}" alt="Логотип" style="height: 50px; margin-right: 15px;">
                </a>
                <h1 style="margin: 0;">Онлайн-курсы</h1>
            </div>
            <nav>
                <a href="{% url 'course_list' %}">Курсы</a>
                {% if user.is_authenticated %}
                    {% if user.role == 'student' %}
                        <a href="{% url 'student_dashboard' %}">Панель студента</a>
                        <a href="{% url 'student_profile' %}">YOUR PROFILE</a>  <!-- 👈 добавлено -->
                    {% elif user.role == 'teacher' %}
                        <a href="{% url 'teacher_dashboard' %}">Панель преподавателя</a>
                    {% endif %}
                    <a href="{% url 'logout' %}">Выйти</a>
                {% else %}
                    <a href="{% url 'login' %}">Войти</a>
                    <a href="{% url 'register' %}">Регистрация</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
