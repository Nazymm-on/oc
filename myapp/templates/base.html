<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Онлайн-курсы</title>
</head>
<body>
    <h1>Онлайн-курсы</h1>
    <nav>
        <a href="{% url 'course_list' %}">Курсы</a>
        {% if user.is_authenticated %}
            {% if user.role == 'student' %}
                <a href="{% url 'student_dashboard' %}">Студент</a>
            {% elif user.role == 'teacher' %}
                <a href="{% url 'teacher_dashboard' %}">Преподаватель</a>
            {% endif %}
            <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}">Вход</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
